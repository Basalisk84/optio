apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  namespace: {{ .Values.namespace }}
  labels:
    app: optio-web
    {{- include "optio.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app: optio-web
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: optio-web
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq .Values.web.antiAffinity "hard" }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: optio-web
              topologyKey: kubernetes.io/hostname
      {{- else if eq .Values.web.antiAffinity "soft" }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: optio-web
                topologyKey: kubernetes.io/hostname
      {{- end }}
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.web.port }}
          env:
            {{- $webEnv := .Values.web.env | default dict }}
            - name: NEXT_PUBLIC_API_URL
              value: {{ get $webEnv "NEXT_PUBLIC_API_URL" | default (printf "http://%s-api:%v" .Release.Name .Values.api.port) | quote }}
            - name: NEXT_PUBLIC_WS_URL
              value: {{ get $webEnv "NEXT_PUBLIC_WS_URL" | default (printf "ws://%s-api:%v" .Release.Name .Values.api.port) | quote }}
            {{- range $name, $value := $webEnv }}
            {{- if and (ne $name "NEXT_PUBLIC_API_URL") (ne $name "NEXT_PUBLIC_WS_URL") }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
  namespace: {{ .Values.namespace }}
  labels:
    app: optio-web
    {{- include "optio.labels" . | nindent 4 }}
spec:
  type: {{ .Values.web.service.type }}
  selector:
    app: optio-web
  ports:
    - port: {{ .Values.web.port }}
      targetPort: {{ .Values.web.port }}
      {{- if and (eq .Values.web.service.type "NodePort") .Values.web.service.nodePort }}
      nodePort: {{ .Values.web.service.nodePort }}
      {{- end }}
